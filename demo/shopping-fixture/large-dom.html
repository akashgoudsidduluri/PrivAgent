<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ApexCart — Large Catalog Database</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
    .sticky-header { position: sticky; top: 0; background: #1e293b; padding: 15px 20px; border-bottom: 1px solid #334155; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 20px; }
    .catalog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
    .item-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; }
    .item-card h3 { margin: 0 0 8px 0; font-size: 16px; color: #38bdf8; }
    .item-card p { margin: 4px 0; font-size: 13px; color: #94a3b8; }
    .btn-action { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 8px; }
    .btn-disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="sticky-header">
    <h1>High-Density Catalog (3,000+ DOM Nodes)</h1>
    <div>
      <input type="text" id="catalog-search" placeholder="Search catalog..." style="padding: 6px 12px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white;">
      <button id="btn-catalog-filter" class="btn-action">Filter</button>
    </div>
  </div>

  <div class="catalog-grid" id="catalog-container">
    <!-- Generated dynamically with 300 item cards to exceed 2,500 DOM nodes -->
  </div>

  <script>
    const container = document.getElementById('catalog-container');
    const items = [];
    for (let i = 1; i <= 400; i++) {
      const isTarget = i === 142;
      const title = isTarget ? 'Special Edition Titanium Watch' : `Standard Inventory Item #${i}`;
      items.push(`
        <div class="item-card" id="card-item-${i}">
          <h3 class="product-title">${title}</h3>
          <p class="sku">SKU: IND-2026-${1000 + i}</p>
          <p class="specs">Category: Hardware | Batch: Alpha-${i % 10} | Warehouse: Sector-${(i % 5) + 1}</p>
          <p class="price">Price: ₹${(i * 17) % 5000 + 499}</p>
          <div class="actions">
            <button class="btn-action btn-select" id="btn-select-${i}">Select</button>
            <button class="btn-action btn-disabled" disabled aria-disabled="true" id="btn-disabled-${i}">Unavailable</button>
          </div>
        </div>
      `);
    }
    container.innerHTML = items.join('');
  </script>
</body>
</html>
