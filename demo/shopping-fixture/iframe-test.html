<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ApexCart — Iframe Host Interface</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
    .frame-wrapper { border: 2px solid #334155; border-radius: 8px; margin-top: 15px; overflow: hidden; }
    iframe { width: 100%; height: 320px; border: none; }
  </style>
</head>
<body>
  <h1>Parent Host Page</h1>
  <p>Tests safe same-origin iframe inspection alongside cross-origin security boundary enforcement.</p>
  <button id="btn-parent-action" style="background:#3b82f6; color:white; border:none; padding:8px 16px; border-radius:4px;">Parent Control Button</button>

  <h3>Same-Origin Frame (Embedded SPA)</h3>
  <div class="frame-wrapper">
    <iframe id="frame-same-origin" src="spa.html"></iframe>
  </div>

  <h3 style="margin-top:20px;">Sandboxed Cross-Origin Frame</h3>
  <div class="frame-wrapper">
    <iframe id="frame-cross-origin" sandbox="allow-scripts" src="about:blank"></iframe>
  </div>
</body>
</html>
