<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivAgent — Autonomous Privacy Browser Agent</title>
    <meta
      name="description"
      content="PrivAgent Autonomous Browser Agent (SIH26171 / ISRO) — Modern AI agent interface with provable on-device privacy protection."
    />
    <link rel="icon" type="image/png" href="../extension/public/icons/icon48.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Public Marketing Experience Container (Mounted on /) -->
    <div id="marketing-container" style="display: none;"></div>

    <!-- Existing Browser-Agent Workspace Container (Mounted on /app) -->
    <div id="app" style="display: none;">
      <!-- Minimal Modern Top Header -->
      <header id="app-topbar" class="app-topbar"></header>

      <!-- Main Layout (Persistent Sidebar + Workspace) -->
      <div class="app-main-layout">
        <!-- Persistent Modern Left Sidebar -->
        <aside id="app-sidebar" class="app-sidebar"></aside>

        <!-- Central Agent Workspace (Conversation Stream & Live Response Panel) -->
        <main id="app-workspace" class="app-workspace"></main>
      </div>

      <!-- Modern Bottom Task Composer -->
      <div id="app-composer"></div>

      <!-- Secondary Drawer / Modal for In-Depth Tooling & Benchmarks -->
      <div id="app-secondary-drawer" class="secondary-drawer-overlay"></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
